ShortDescription: Single-binary HTTPS debugging proxy with a web UI that shows the TLS fingerprint of every client.
Description: |-
  wirust sits between an app and its servers and shows every request and response. It decrypts
  HTTPS with a certificate authority it creates on your machine, and has a web UI with search,
  rules (block, mock, map, rewrite, throttle), breakpoints, replay, HAR import and export and
  WebSocket messages. For each client it also shows the JA4 and JA3 fingerprint of its TLS
  handshake and the known client it matches. Free software, one binary, no account, no telemetry.
