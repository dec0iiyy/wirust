[package]
name = "wirust"
description = "Single-binary HTTPS debugging proxy with a web UI: decrypts TLS with a local CA, shows each client's TLS fingerprint (JA4, JA3)"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/dec0iiyy/wirust"
homepage = "https://github.com/dec0iiyy/wirust"
readme = "../../README.md"
keywords = ["proxy", "https", "debugging", "mitm", "ja4"]
categories = ["command-line-utilities", "development-tools::debugging", "network-programming"]
# Not on crates.io yet: crates.io refuses git dependencies, and `fingerprint` comes from the
# mirrust repository until it is published there as `mirrust-fingerprint`.
publish = false

[lib]
name = "wirust"
path = "src/lib.rs"

[[bin]]
name = "wirust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Already built for rcgen and rustls; used directly only for the SHA-1 thumbprint that
# `certutil -delstore` and `security delete-certificate` identify a certificate by.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
brotli-decompressor = { version = "6.3", default-features = false, features = ["std"] }
bytes = "1.12.2"
dirs = "7.0.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
fingerprint = { git = "https://github.com/dec0iiyy/mirrust", tag = "v0.1.6", version = "0.1.0" }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.12"
rustls = "0.23.46"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-rustls = "0.26.6"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
webpki-roots = "1.0.12"
# `.proto` schemas for the gRPC view: compiled in-process (no protoc binary) and decoded
# into dynamic messages. Both pure Rust.
protox = "0.10.0"
prost-reflect = "0.16.5"

[dev-dependencies]
# Compresses test bodies; the proxy itself only decodes.
brotli = { version = "9.1", default-features = false, features = ["std"] }

[lints]
workspace = true
