name: Feature request
description: Something wirust should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The debugging task, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The behaviour you have in mind. Check docs/roadmap.md first; it may be listed there.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other tools
      description: How another proxy does it, if one does, with a link.
