version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rustls-and-hyper:
        patterns: ["rustls*", "tokio-rustls", "rcgen", "webpki-roots", "hyper*", "http*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
